[package]
name = "sshm"
version = "0.1.0"
edition = "2021"
description = "SSH connection manager with fuzzy-select TUI"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
anyhow = "1"
dirs = "5"
chrono = "0.4"

[profile.release]
strip = true
lto = true
